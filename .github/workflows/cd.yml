name: 🚀 CD — Deploy to Streamlit Cloud

on:
  push:
    branches: ["main"]
  workflow_dispatch:         # allow manual trigger from GitHub UI

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  build-check:
    name: 🏗️ Build & Smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Verify backend imports cleanly
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from backend.groq_client import build_system_message, DEFAULT_MODEL
          print('✅ Backend imports OK — model:', DEFAULT_MODEL)
          "

      - name: ✅ Verify Streamlit app parses without errors
        run: |
          pip install streamlit
          python -c "
          import ast, sys
          with open('frontend/app.py') as f:
              src = f.read()
          ast.parse(src)
          print('✅ frontend/app.py syntax OK')
          "

  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: ☁️ Deploy (Streamlit Cloud)
    runs-on: ubuntu-latest
    needs: build-check
    environment: production

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Streamlit Cloud deploys automatically when you push to main — the step
      # below is a lightweight webhook trigger you can configure in your
      # Streamlit Cloud workspace settings.
      #
      # To use it:
      #   1. Go to share.streamlit.io → your app → Settings → Webhooks
      #   2. Copy the deploy webhook URL
      #   3. Add it as the repository secret  STREAMLIT_DEPLOY_WEBHOOK_URL
      # -----------------------------------------------------------------------
      - name: 🚀 Trigger Streamlit Cloud deploy webhook
        if: ${{ env.STREAMLIT_DEPLOY_WEBHOOK_URL != '' }}
        env:
          STREAMLIT_DEPLOY_WEBHOOK_URL: ${{ secrets.STREAMLIT_DEPLOY_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$STREAMLIT_DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"event": "push", "branch": "main"}' \
            --fail \
            && echo "✅ Deploy webhook triggered successfully" \
            || echo "⚠️  Webhook call failed — check the URL secret"

      - name: 📝 Deployment summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor  | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time   | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "App: **frontend/app.py** deployed via Streamlit Cloud." >> $GITHUB_STEP_SUMMARY
